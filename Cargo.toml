[workspace]
resolver = "3"
members = ["crates/rinsai-game", "crates/rinsai-search", "crates/rinsai"]

# Crates are split when there is a reason, not up front — DESIGN.md §4 names
# the phases the remaining ones arrive at.

[workspace.package]
version = "0.1.0"
edition = "2024"
# shunsai declares no `rust-version`, but its movegen uses a let-chain
# (src/movegen.rs:589) stabilised in 1.88, so 1.88 is the real floor — edition
# 2024 only needs 1.85. Raising this is a DECISIONS.md event: floodgate and WCSC
# hosts may lag, and an engine has no reason to chase the toolchain.
rust-version = "1.88"
authors = ["sugyan"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sugyan/rinsai"

[workspace.dependencies]
# TEMPORARY DEVIATION from DESIGN.md §2 ("a released version, not a git pin").
# shunsai is not on crates.io yet and has no remote tags, so the pin is a full
# 40-hex commit — never a branch, which would be the silent drift that
# ../benchmarks' pin policy exists to forbid. https rather than the local
# clone's ssh remote, so CI fetches anonymously.
#
#   TODO(shunsai-0.1-release): when shunsai v0.1.0 is on crates.io, replace this
#   line with `shunsai = "0.1"`, drop the allow-git entry in deny.toml, remove
#   the deviation footnote in DESIGN.md §2, and append the switch to
#   DECISIONS.md. Those four are what change; `git grep
#   'TODO(shunsai-0.1-release)'` also finds the prose that refers to them. It is
#   an E0 exit criterion in PROGRESS.md.
#
# `version` alongside `git` states the semver expectation the rev stands in for,
# and turns the eventual switch into deleting two fields. It does not affect
# `cargo deny`, which reports `bans ok` either way.
shunsai = { git = "https://github.com/sugyan/shunsai", rev = "e58c16fc073f07ae79f6a94b3bcd69f7e7937bb2", version = "0.1" }

# Must stay compatible with shunsai's own requirement so the types unify into a
# single copy — otherwise `Move` and `Square` silently become two types. CI
# asserts exactly one `shogi_core` in Cargo.lock.
shogi_core = "0.1.5"
shogi_usi_parser = "0.1"
# The referee's legality source, deliberately not shunsai: a game the harness
# referees with an independent implementation is a differential test of the
# players rather than an echo of one of them.
shogi_legality_lite = "0.1.3"
shogi_official_kifu = "0.1.2"

rinsai-game = { path = "crates/rinsai-game" }
rinsai-search = { path = "crates/rinsai-search" }

# WARNING: no shunsai feature may ever be enabled from here — not by a
# `[features]` forward, and not by a `features = [...]` list above.
# `slider-naive` wins shunsai's backend priority order and would silently select
# a 5-8x slower generator, making every SPRT number afterwards noise;
# `bench-internals` is documented "never enable as a dependency". CI checks the
# *resolved graph* (`cargo tree -e features -i shunsai`) rather than manifest
# text, because a grep catches only the first of those two forms.

[workspace.lints.rust]
# `deny`, not `forbid`: E2 and E3 will need annotated exceptions, and `forbid`
# cannot be lifted locally — which would force an edit to this file under
# pressure and tempt a blanket removal.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Pairs with unsafe_code above: when unsafe does arrive, every block already has
# to carry a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
# stdout IS the USI protocol channel — a stray `println!` corrupts a live game.
# Exactly one module (the protocol writer) carries an allow.
print_stdout = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# shunsai sets these for itself, but a dependency's profile is ignored: the
# workspace root is the only place they take effect.
lto = "fat"
codegen-units = 1
# Deliberately NOT `panic = "abort"`: the worker catches a panic from the
# searcher, answers `resign` for that move and keeps playing, with the message
# on stderr. Aborting takes the whole engine down mid-tournament instead.

# `cargo build --profile profiling` for samply / Instruments.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Load-bearing: the test suite runs real searches, and shunsai's movegen is the
# hot loop in a debug run too. debug_assertions stay on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
