# cargo-deny — CLAUDE.md's top rule (stay permissive, no GPL reuse), mechanized.
#
# This checks the *dependency graph*. It cannot detect a copied GPL algorithm;
# that is what the pre-release provenance scan (CLAUDE.md §7) is for. What it
# does catch is the easy failure: a permissively-licensed crate somewhere in the
# tree quietly gaining a copyleft dependency.

[licenses]
# Everything rinsai links must be usable under `MIT OR Apache-2.0`. The list is
# exactly what the graph uses today and nothing more: an unmatched allowance is
# a permission granted in advance, and widening it should be a deliberate act
# with a reason, not something that was already there.
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A dependency with no version requirement at all is how an unreviewed crate
# arrives without anyone noticing.
wildcards = "deny"
# …but a path dependency between our own `publish = false` crates has nothing
# to put a version on, and there is no third party involved. Exempt those only.
# The git dependency on shunsai is *not* exempted: it carries an explicit
# `version = "0.1"` instead, which is both the semver expectation and one less
# thing to remember at TODO(shunsai-0.1-release).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# TODO(shunsai-0.1-release): delete this entry when shunsai is on crates.io.
# Removing it is *part of* the switch, and `cargo deny check sources` fails
# until the manifest stops using the git source — so the switch cannot be
# half-done silently.
allow-git = ["https://github.com/sugyan/shunsai"]
