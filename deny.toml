# cargo-deny — CLAUDE.md's top rule (stay permissive, no GPL reuse), mechanized.
#
# This checks the *dependency graph*. It cannot detect a copied GPL algorithm;
# that is what the pre-release provenance scan (CLAUDE.md §2) is for. What it
# does catch is the easy failure: a permissively-licensed crate somewhere in the
# tree quietly gaining a copyleft dependency.

[advisories]
# Checked, and the reason is recorded because every other choice in this file
# has one. RUSTSEC is about *security*, which the licence and source checks say
# nothing about, and the third-party half of the tree is small enough that the
# run is nearly free and a hit would be real rather than noise.
#
# The cost is named rather than discovered later: this is the one CI check that
# can go red on a day nobody touched the code, when a new advisory lands against
# something already in the graph. That is information the project wants — an
# engine that runs on floodgate and on a championship machine is software other
# people host — so it is a `deny`, not a warning, and an unavoidable one gets an
# explicit `ignore` entry here with the reason.
version = 2
yanked = "deny"
ignore = []

[licenses]
# Everything rinsai links must be usable under `MIT OR Apache-2.0`. The list is
# exactly what the graph uses today and nothing more: an unmatched allowance is
# a permission granted in advance, and widening it should be a deliberate act
# with a reason, not something that was already there.
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A dependency with no version requirement at all is how an unreviewed crate
# arrives without anyone noticing.
wildcards = "deny"
# …but a path dependency between our own `publish = false` crates has nothing
# to put a version on, and there is no third party involved. Exempt those only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
