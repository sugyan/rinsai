name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Caches ~/.cargo/registry and target/. The key derives from Cargo.lock —
      # one more reason the lock is committed.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # `--locked` makes a stale Cargo.lock a failure rather than a silent
      # re-resolve.
      #
      # `--all-features` is safe only because no rinsai crate declares a feature
      # that forwards into shunsai: the flag activates features of the *selected
      # workspace packages*, never of a registry dependency, so it cannot reach
      # `slider-naive` or `bench-internals`. The "No shunsai feature is enabled"
      # job below is what keeps that premise true.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

      # Guards CONVENTIONS.md's Portability rule at the only point CI can
      # check it: `rinsai-search`'s library, which is the search core the rule
      # is about, plus its whole dependency tree. The `rinsai` binary is
      # deliberately out of scope — it is stdio and process handling, which is
      # native by construction.
      #
      # ⚠️ This catches only what fails to *compile*: an `std::arch` intrinsic,
      # or a dependency with no wasm build. It does **not** catch the std APIs
      # that compile for this target and panic when reached, which is most of
      # the ones that matter — `thread`, `Instant`, `Condvar`, `fs` and `net`
      # all pass here today. The measurement behind this is a release binary,
      # built separately, whose search has been eliminated behind the first of
      # them; nothing in CI builds that. A green check is not a supported
      # target and must not be reported as one.
      - name: rinsai-search compiles for wasm32
        run: cargo check -p rinsai-search --lib --locked --target wasm32-unknown-unknown

      # Doc comments link into each other and into the design record. A link
      # that no longer resolves — a renamed item, a moved module — is quiet
      # drift `cargo test` does not see. ⚠️ This is the *only* prose defect CI
      # can catch: a false claim is not a broken link, which is why CLAUDE.md
      # §4 makes the rule "write less" rather than "check harder".
      - name: Docs build with no broken links
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # Checked on the *resolved graph*, not by grepping manifests. A grep for
      # `"shunsai/…"` only catches the `[features]`-table forwarding syntax and
      # misses the ordinary route — `features = ["slider-naive"]` on the
      # dependency line itself — which enables the backend just as effectively.
      # This is also what makes `--all-features` above safe to run.
      - name: No shunsai feature is enabled
        run: |
          enabled=$(cargo tree --locked -e features -i shunsai \
                    | grep -oE 'shunsai feature "[^"]+"' | sort -u | grep -v '"default"' || true)
          if [ -n "$enabled" ]; then
            echo "$enabled"
            echo "::error::A shunsai feature is enabled. Either slider flag replaces the backend shunsai's bake-off adopted with one it documents as being for A/B measurement and debugging rather than real use, which would make every SPRT number afterwards noise; bench-internals is explicitly not public API. Never enable either from here."
            exit 1
          fi

      # A "§N" citation is prose, so nothing else in this pipeline looks at
      # it — and the project has now shipped two families of stale ones: three
      # citations to a CLAUDE.md section that never existed, and three to a
      # DESIGN.md section that had been moved out. Both were repaired by hand,
      # one instance at a time. This is the gate that stops the third family.
      - name: Every "FILE.md §N" citation resolves
        run: |
          bad=0
          # Field separator is the citation itself, so a line with two of them
          # yields both. `|| true` for the same reason as the steps below: a
          # file with no citations must not kill the step.
          grep -rhoE '[A-Za-z_]+\.md §[0-9]+' \
               --include='*.md' --include='*.rs' --include='*.toml' \
               --include='*.yml' . 2>/dev/null | sort -u > /tmp/cites || true
          while read -r file section; do
            [ -f "$file" ] || { echo "::error::citation names a file that does not exist: $file $section"; bad=1; continue; }
            n=${section#§}
            grep -qE "^#{2,3} ${n}\. " "$file" || {
              echo "::error::$file has no section ${n}, but something cites '$file $section'"
              bad=1
            }
          done < /tmp/cites
          exit $bad

      - name: Exactly one shogi_core in the graph
        run: |
          # `|| true` is load-bearing, as in the step above: the default shell
          # is `bash -e`, and `grep -c` exits 1 when it matches nothing, so
          # without it a count of zero kills the step *before* the message
          # below can explain why — and explaining why is this guard's whole
          # job. Measured: `bash -e` on `n=$(grep -c …)` with no match exits 1
          # having printed nothing.
          n=$(grep -c '^name = "shogi_core"$' Cargo.lock || true)
          test "$n" -eq 1 || {
            echo "::error::shogi_core appears $n times in Cargo.lock. rinsai's requirement must stay compatible with shunsai's, or the shogi_core types stop unifying and Move/Square silently become two different types."
            exit 1
          }

  # `rust-version = "1.88"` is only true if something checks it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # CLAUDE.md's top rule (stay permissive, no GPL reuse), mechanized as far as a
  # dependency-graph check can take it. See deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
